name: Tests

on:
  push:
    paths-ignore:
      - "agent_kb_core/**"
      - ".github/workflows/agent-kb-core.yml"
  pull_request:
    paths-ignore:
      - "agent_kb_core/**"
      - ".github/workflows/agent-kb-core.yml"

concurrency:
  group: legacy-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "agent_kb_core[dev]"


      - name: Run fast tests (repository root entry)
        env:
          PYTHONPATH: agent_kb_core/src;agent_kb_core/tests
        run: python -m pytest -q --tb=short

  integration-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "agent_kb_core[dev]"


      - name: Run integration tests
        env:
          PYTHONPATH: agent_kb_core/src;agent_kb_core/tests
        run: python agent_kb_core/tools/run_integration_marker.py

